# Application
spring.application.name=recipe-review
server.port=${PORT:8080}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE}

# Security
jwt.access.secret=${JWT_ACCESS_SECRET}
jwt.refresh.secret=${JWT_REFRESH_SECRET}
jwt.access.expiration=15
jwt.refresh.expiration=7

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# YouTube API
youtube.api.key=${YOUTUBE_API_KEY}

# Rate Limiting
rate.limit.requests=100
rate.limit.duration=60

# Logging
logging.level.root=INFO
logging.level.com.example.recipe_review=WARN
logging.level.org.springframework.security=WARN

# Server
server.tomcat.max-threads=200
server.tomcat.accept-count=100
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=3600s 