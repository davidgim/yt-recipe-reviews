# Application
spring.application.name=recipe-review
server.port=8080

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/recipe_review}
spring.data.mongodb.database=${MONGODB_DATABASE:recipe_review}

# Security
jwt.access.secret=${JWT_ACCESS_SECRET:your_dev_access_secret_key}
jwt.refresh.secret=${JWT_REFRESH_SECRET:your_dev_refresh_secret_key}
jwt.access.expiration=15
jwt.refresh.expiration=7

# CORS
cors.allowed-origins=http://localhost:3000

# Logging
logging.level.root=INFO
logging.level.com.example.recipe_review=DEBUG
logging.level.org.springframework.security=DEBUG 